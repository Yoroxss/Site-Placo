<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="50%" stop-color="#0e0e0e" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS App Icon Shape Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.35" />

  <!-- Artisan Pattern Lines / Plasterer Trowel Subtle Silhouette -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.15" stroke-dasharray="8 6" />

  <!-- Central PB Monogram -->
  <g filter="url(#glow)">
    <text x="256" y="275" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Georgia', serif" font-size="160" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
      PB
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="28" font-weight="600" fill="#d1d1c4" text-anchor="middle" letter-spacing="8" opacity="0.85">
    ADMIN
  </text>
  <text x="256" y="400" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="20" font-weight="400" fill="#f59e0b" text-anchor="middle" letter-spacing="4" opacity="0.6">
    ARCACHON
  </text>
</svg>
